<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>新年快乐</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
body{
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, #ffd1dc 0%, transparent 26%),
    radial-gradient(circle at 80% 10%, #ffb6d9 0%, transparent 28%),
    radial-gradient(circle at 50% 80%, #ff9ec7 0%, transparent 32%),
    linear-gradient(135deg, #ffe4f1 0%, #ffc2df 45%, #ffa5d2 100%);
  transition: background 0.5s ease;
}

/* ====== 星星拖尾特效 ====== */
.star-trail {
  position: fixed; pointer-events: none; z-index: 9999; color: #fff;
  text-shadow: 0 0 5px #ff4d8d, 0 0 10px #ff4d8d; font-size: 16px;
  animation: starFade 1s ease-out forwards;
}
@keyframes starFade {
  0% { transform: translate(-50%, -50%) translateY(0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) translateY(30px) scale(0.2) rotate(180deg); opacity: 0; }
}

#heartsBg{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-heart{ position: absolute; bottom: -40px; color: #ff6fa2; opacity: 0.35; animation: floatUp linear infinite; user-select: none; }
@keyframes floatUp{ 0%{ transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 10%{ opacity: 0.4; } 90%{ opacity: 0.35; } 100%{ transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; } }

/* ====== 通用面板样式 ====== */
.overlay-panel {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.5s ease; padding: 20px;
}
.overlay-panel.show { opacity: 1; pointer-events: auto; }
.glass-box {
  width: min(340px, 90vw); background: rgba(255,255,255,0.25); backdrop-filter: blur(16px) saturate(130%); -webkit-backdrop-filter: blur(16px) saturate(130%);
  border-radius: 16px; border: 1px solid rgba(255,255,255,0.4); padding: 28px 24px; text-align: center;
  box-shadow: 0 10px 30px rgba(255,80,140,0.2); transition: box-shadow 0.3s ease;
}
.glass-box.pulse { box-shadow: 0 0 30px rgba(255, 77, 141, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.8); }
.box-title { font-size: 20px; color: #c41e5c; font-weight: bold; margin-bottom: 10px; }
.box-text { font-size: 15px; color: #882b55; margin-bottom: 20px; line-height: 1.5; }

/* ====== 中心大弹窗 ====== */
#grandModal {
  z-index: 50;
  background: rgba(0,0,0,0.1); 
}
.grand-box {
  width: min(320px, 85vw);
  background: #ffffff;
  border-radius: 20px;
  padding: 45px 25px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(255, 80, 140, 0.35), 0 0 0 10px rgba(255, 255, 255, 0.3);
  transform: scale(0.1);
  opacity: 0;
  transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
  cursor: pointer;
}
#grandModal.show .grand-box {
  transform: scale(1);
  opacity: 1;
}
.grand-title {
  font-size: 32px;
  font-weight: 900;
  color: #c41e5c;
  letter-spacing: 4px;
  margin-bottom: 15px;
  text-shadow: 0 2px 10px rgba(255, 77, 141, 0.2);
}
.grand-subtitle {
  font-size: 16px;
  color: #882b55;
  font-weight: 500;
  line-height: 1.6;
}
.grand-hint {
  margin-top: 25px;
  font-size: 13px;
  color: #ff75a8;
  animation: blink 1.5s infinite;
}

/* ====== 阶段一：情绪探测仪 ====== */
.slider-container { padding: 10px 0 25px; position: relative; }
#emotionSlider { 
  -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
  background: linear-gradient(90deg, #ffd1dc, #ff4d8d); border-radius: 10px; outline: none;
  margin: 15px 0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); 
}
#emotionSlider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; background: #fff; border: 4px solid #ff4d8d;
  border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255, 77, 141, 0.6), 0 0 5px rgba(255, 77, 141, 0.4); transition: transform 0.1s;
}
#emotionSlider::-webkit-slider-thumb:active { transform: scale(1.1); }
#emotionSlider::-moz-range-thumb {
  width: 24px; height: 24px; background: #fff; border: 4px solid #ff4d8d;
  border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255, 77, 141, 0.6), 0 0 5px rgba(255, 77, 141, 0.4);
}
#emotionSlider::-moz-range-track {
  height: 16px; background: linear-gradient(90deg, #ffd1dc, #ff4d8d); border-radius: 10px;
}

.slider-labels { display: flex; justify-content: space-between; padding: 0 16px; font-size: 14px; color: #882b55; font-weight: bold; margin-top: -10px; }
#emotionFeedback {
  margin-top: 15px; margin-bottom: 20px; font-size: 16px; color: #c41e5c; font-weight: bold; min-height: 50px;
  opacity: 0; transform: translateY(10px); transition: all 0.3s ease; line-height: 1.6; padding: 0 10px;
}
#emotionFeedback.show { opacity: 1; transform: translateY(0); }

.action-btn {
  width: 100%; height: 44px; border-radius: 22px; border: none; font-size: 16px; font-weight: bold; 
  background: linear-gradient(135deg, #ff75a8, #ff4d8d); color: #fff; cursor: pointer; 
  box-shadow: 0 4px 12px rgba(255,77,141,0.3); transition: 0.2s; padding: 0 15px;
}
.action-btn:hover { filter: brightness(1.05); }
.action-btn:active { transform: scale(0.95); }
#claimSurpriseBtn { display: none; } 

/* ====== 阶段二：默契大考验 ====== */
.quiz-btn, .skip-menu-btn {
  display: block; width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px;
  border: 1px solid #ff75a8; background: rgba(255,255,255,0.6); color: #c41e5c; font-size: 16px; cursor: pointer; transition: 0.2s;
}
.quiz-btn:hover, .skip-menu-btn:hover { background: rgba(255, 235, 241, 0.9); }
.quiz-btn:active, .skip-menu-btn:active { transform: scale(0.95); background: #ffebf1; }
.quiz-btn.wrong { animation: shake 0.4s; border-color: #ff0000; color: #ff0000; background: rgba(255,0,0,0.1); }
@keyframes shake{ 0%, 100%{ transform: translateX(0); } 20%{ transform: translateX(-8px); } 40%{ transform: translateX(8px); } 60%{ transform: translateX(-6px); } 80%{ transform: translateX(6px); } }

/* ====== 阶段三：逼真 404 页面 ====== */
#crashPanel {
  background: #ffffff; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: opacity 0.4s ease;
}
.error-page { text-align: center; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.error-code { font-size: 150px; font-weight: 800; color: #333333; line-height: 1; margin-bottom: 15px; letter-spacing: -3px; transition: color 0.3s ease; }
.error-title { font-size: 20px; font-weight: 500; color: #555555; letter-spacing: 4px; margin-bottom: 15px; transition: color 0.3s ease; }
.error-msg { font-size: 14px; color: #888888; transition: all 0.3s ease; }
.error-code.love { color: #ff4d8d; text-shadow: 0 0 20px rgba(255, 77, 141, 0.4); }
.error-title.love { color: #c2185b; letter-spacing: 2px; }
.error-msg.love { color: #902b55; font-weight: bold; font-size: 16px; }

/* ====== 原有输入面板 ====== */
#inputPanel{ position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out; }
#inputPanel.hide{ transform: translateY(120vh); opacity: 0; pointer-events: none; }
.title1-wrap{ background: rgba(255, 255, 255, 0.18); padding: 14px 36px; border-radius: 24px; box-shadow: 0 8px 32px rgba(255, 105, 180, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.4); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255, 255, 255, 0.35); margin-bottom: 16px; }
.title1{ font-size: clamp(22px, 6vw, 28px); color: #c41e5c; letter-spacing: 6px; font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 18px rgba(255, 116, 168, 0.8); }
.title2{ font-size: clamp(18px, 5vw, 22px); color: #c2185b; margin-bottom: 12px; letter-spacing: 2px; font-weight: 500; }
.title3{ font-size: clamp(15px, 4.2vw, 18px); color: #b04070; margin-bottom: 36px; letter-spacing: 1px; font-weight: 400; text-align: center; }
#nameInput{ width: min(280px, 80vw); height: 46px; border-radius: 24px; border: 2px solid #ff9ec7; outline: none; padding: 0 20px; font-size: 16px; font-weight: 400; background: #fff8fc; color: #773355; box-shadow: 0 0 14px #ff9ec788; transition: border-color 0.3s, box-shadow 0.3s; }
#nameInput.shake{ border-color: #ff4d8d; animation: shake 0.4s; }
#inputHint{ margin-top: 12px; font-size: 14px; color: #c2185b; min-height: 20px; opacity: 0; transition: opacity 0.3s; }
#inputHint.show{ opacity: 1; }
#confirmBtn{ margin-top: 20px; width: 140px; height: 44px; border-radius: 22px; border: none; font-size: 17px; font-weight: 500; background: linear-gradient(135deg, #ff75a8, #ff4d8d); color: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px #ff4d8d66; }
#confirmBtn:hover{ filter: brightness(1.05); }
#confirmBtn:active{ transform: scale(0.95); }

/* ====== 弹窗与爱心 ====== */
.win.heart-item, .win.full-item{ position: absolute; width: 110px; height: 60px; border-radius: 10px; box-shadow: 0 0 14px #ffffffaa; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; font-size: 12px; font-weight: 400; color: #444444; opacity: 0; transition: all 0.55s ease; line-height: 1.35; z-index: 5; pointer-events: none; }
.win.heart-item{ transform: translateY(120vh) scale(0.5); }
.win.heart-item.show{ opacity: 1; transform: translateY(0) scale(1); }
.win.heart-item.hide{ opacity: 0; transform: scale(0.6); }
.win.full-item{ transform: scale(0.5); }
.win.full-item.show{ opacity: 1; transform: scale(1); }

/* 满屏弹幕缓慢淡出并消失特效 */
.win.full-item.zoom-out {
  opacity: 0 !important; 
  transition: all 1.5s ease; /* 1.5s 缓慢淡出 */
}

/* ====== 悬浮按钮通用样式 ====== */
.floating-btn {
  position: fixed; top: 16px; z-index: 999; padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.3);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #a42c5e; font-size: 13px; cursor: pointer; transition: opacity 0.3s ease, background 0.3s ease;
}
.floating-btn:hover { background: rgba(255,255,255,0.5); }
#skipBtn { right: 16px; opacity: 0; pointer-events: none; }
#skipBtn.show { opacity: 1; pointer-events: auto; }
#backToLetterBtn { left: 16px; }

#confirmModal{ position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 30; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; padding: 20px; }
#confirmModal.appear{ opacity: 1; pointer-events: auto; }
.modal-box{ width: min(340px, 90vw); background: rgba(255,255,255,0.22); backdrop-filter: blur(16px) saturate(130%); border-radius: 16px; border: 1px solid rgba(255,255,255,0.35); padding: 28px 24px; box-shadow: 0 8px 30px rgba(255,80,140,0.25); }
.modal-text{ text-align: center; font-size: 17px; color: #882b55; margin-bottom: 26px; line-height: 1.6; }
.btn-row{ display: flex; gap: 16px; justify-content: center; }
.modal-btn{ padding: 10px 26px; border-radius: 22px; border: none; font-size: 16px; cursor: pointer; transition: all 0.4s ease; }
.modal-btn:hover { filter: brightness(1.03); }
#btnNo{ background: #e8e8e8; color: #555; }
#btnNo.hideBtn{ opacity: 0; pointer-events: none; transform: scale(0.7); }
#btnYes{ background: linear-gradient(135deg,#ff75a8,#ff4d8d); color: #fff; box-shadow: 0 4px 14px #ff4d8d44; }
.random-float-btn{ position: fixed; z-index: 35; border: none; border-radius: 24px; padding: 8px 20px; font-size: 15px; cursor: pointer; background: #eeeeee; color: #444; box-shadow: 0 4px 12px #00000022; transition: transform 0.3s ease; user-select: none; -webkit-user-select: none; }
.random-float-btn:active{ transform: scale(0.92); }

#forceModal{ position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 45; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; padding: 20px; }
#forceModal.show{ opacity: 1; pointer-events: auto; }
.force-box{ width: min(320px, 90vw); background: rgba(255,255,255,0.24); backdrop-filter: blur(16px) saturate(130%); border-radius: 16px; border: 1px solid rgba(255,255,255,0.4); padding: 30px 24px; text-align: center; }
.force-text{ font-size: 18px; color: #902b55; margin-bottom: 24px; line-height: 1.7; }
#forceOkBtn{ border: none; border-radius: 24px; padding: 10px 30px; font-size: 16px; color: white; background: linear-gradient(135deg,#ff75a8,#ff4d8d); box-shadow: 0 4px 14px #ff4d8d44; cursor: pointer; }
#forceOkBtn:hover { filter: brightness(1.05); }

/* ====== 信封 ====== */
#envelopeWrap { position: fixed; inset: 0; z-index: 48; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; perspective: 1000px; }
#envelopeWrap.show { opacity: 1; pointer-events: auto; }
.envelope { position: relative; width: 280px; height: 180px; background: #fdf5e6; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.6s ease, opacity 0.6s ease; }
.envelope.open { transform: scale(0.9) translateY(50px); opacity: 0; pointer-events: none; }
.env-paper { position: absolute; bottom: 10px; left: 15px; width: 250px; height: 140px; background: #fff; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); transition: transform 0.6s ease; z-index: 2; }
.env-paper.pull { transform: translateY(-100px); }
.env-flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #f4e4c1; border-radius: 8px; transform-origin: top; transition: transform 0.6s ease; z-index: 3; }
.env-flap.open { transform: rotateX(180deg); z-index: 1; }
.env-stamp { position: absolute; bottom: 30px; width: 100%; text-align: center; font-size: 22px; color: #c41e5c; font-family: "Kaiti SC", "STKaiti", serif; font-weight: bold; z-index: 4; pointer-events: none; transition: opacity 0.3s ease; }
.envelope.open .env-stamp { opacity: 0; }
.env-hint { position: absolute; bottom: -40px; width: 100%; text-align: center; color: #fff; font-size: 14px; animation: blink 1.5s infinite; z-index: 5; }
.envelope.open .env-hint { display: none; }

/* ====== 信件 ====== */
#letterBoxWrap{ position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.20); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
#letterBoxWrap.showLetter{ opacity: 1; pointer-events: auto; }
.letter-glass{ width: min(520px, 92vw); min-height: 340px; max-height: 75vh; max-height: 75dvh; overflow-y: auto; background: rgba(255,255,255,0.24); backdrop-filter: blur(20px) saturate(140%); border-radius: 18px; border: 1px solid rgba(255,255,255,0.38); padding: 26px 22px; box-shadow: 0 10px 40px rgba(255,90,150,0.22); position: relative; display: flex; flex-direction: column; }
.type-area{ font-size: 16px; line-height: 2.1; color: #3b312b; white-space: pre-wrap; font-family: "Kaiti SC", "STKaiti", "KaiTi", "Source Han Sans SC", sans-serif; letter-spacing: 1px; flex-grow: 1; }
.cursor{ display: inline-block; width: 2px; height: 1.35em; background: #c2185b; margin-left: 2px; animation: blink 0.6s infinite; vertical-align: text-bottom; }
@keyframes blink{ 0%, 49%{ opacity: 1; } 50%, 100%{ opacity: 0; } }
#loadFullBtnWrap { text-align: center; margin-top: 20px; }
#loadFullBtn, #surpriseBtn { padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.4); color: #a42c5e; font-size: 13px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 10px rgba(255, 105, 180, 0.2); }
#loadFullBtn:hover { background: rgba(255,255,255,0.6); }
#loadFullBtn:active, #surpriseBtn:active { transform: scale(0.95); }
#surpriseBtn { background: linear-gradient(135deg,#ff75a8,#ff4d8d); color: #fff; border: none; margin-left: 10px; font-weight: bold; }
#surpriseBtn:hover { filter: brightness(1.05); }
#letterFooter{ margin-top: 16px; text-align: right; opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none; }
#letterFooter.show{ opacity: 1; transform: translateY(0); pointer-events: auto; }
#replayBtn{ padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.32); color: #a42c5e; font-size: 13px; cursor: pointer; }
#replayBtn:hover { background: rgba(255,255,255,0.55); }

/* ====== 惊喜券 ====== */
#surpriseModal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; padding: 20px; }
#surpriseModal.show { opacity: 1; pointer-events: auto; }
.coupon-card { position: relative; width: min(340px, 90vw); background: #fff9fb; border-radius: 12px; box-shadow: 0 10px 30px rgba(255, 80, 140, 0.3); overflow: hidden; transform: scale(0.8) rotate(-5deg); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
#surpriseModal.show .coupon-card { transform: scale(1) rotate(0deg); }
.coupon-header { background: linear-gradient(135deg, #ff75a8, #ff4d8d); color: #fff; text-align: center; padding: 15px; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
.coupon-body { padding: 25px 20px; text-align: center; position: relative; }
.coupon-title { font-size: 22px; color: #c41e5c; font-weight: bold; margin-bottom: 15px; }
.coupon-text { font-size: 15px; color: #902b55; line-height: 1.6; margin-bottom: 20px; }
.coupon-divider { position: relative; height: 1px; border-bottom: 2px dashed #ffb6d9; margin: 0 20px 20px; }
.coupon-divider::before, .coupon-divider::after { content: ''; position: absolute; top: -12px; width: 24px; height: 24px; background: rgba(0,0,0,0.4); border-radius: 50%; }
.coupon-divider::before { left: -32px; }
.coupon-divider::after { right: -32px; }
.coupon-bottom { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px 25px; position: relative; }
.coupon-code { font-size: 12px; color: #b04070; font-family: monospace; }
.stamp-btn { padding: 8px 16px; background: #ffebf1; border: 1px solid #ff75a8; color: #c41e5c; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.3s ease; }
.stamp-btn:hover { background: #ffdfe9; }
.stamp-btn:active { transform: scale(0.9); }
.stamp-btn.hide { display: none; }
.stamp-mark { position: absolute; right: 20px; bottom: 20px; width: 90px; height: 90px; border: 3px solid #e63946; border-radius: 50%; color: #e63946; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; transform: scale(2) rotate(-20deg); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: inset 0 0 10px rgba(230, 57, 70, 0.3); }
.stamp-mark::before { content: '★'; font-size: 18px; margin-bottom: 2px; }
.stamp-mark.show { transform: scale(1) rotate(-15deg); opacity: 1; }
</style>
</head>
<body>
<div id="heartsBg"></div>

<button id="skipBtn" class="floating-btn">跳过 ≫</button>

<!-- 中心大弹窗 -->
<div id="grandModal" class="overlay-panel">
  <div class="grand-box">
    <div class="grand-title">新年快乐 ♡</div>
    <div class="grand-subtitle" id="grandSubtitle">祝袁语汐天天开心，身体健康</div>
    <div class="grand-hint">👆 点击任意位置继续</div>
  </div>
</div>

<div id="surpriseModal">
  <button id="backToLetterBtn" class="floating-btn">← 返回信件</button>
  <div class="coupon-card">
    <div class="coupon-header">✨ 专属惊喜兑换券 ✨</div>
    <div class="coupon-body">
      <div class="coupon-title">潘城，袁语汐爱你呦～</div>
      <div class="coupon-text">发送这句话给潘城可<br>兑换一份神秘惊喜哦！</div>
    </div>
    <div class="coupon-divider"></div>
    <div class="coupon-bottom">
      <div class="coupon-code">NO. 2024-520-1314</div>
      <button class="stamp-btn" id="stampBtn">点击盖章生效</button>
      <div class="stamp-mark" id="stampMark">
        <div>袁语汐专属</div>
      </div>
    </div>
  </div>
</div>

<div id="inputPanel">
  <div class="title1-wrap">
    <div class="title1" id="pageTitle">祝袁语汐新年快乐</div>

function createStar(e) {
  const now = Date.now();
  if (now - lastStarTime < 60) return;
  lastStarTime = now;
  let x, y;
  if (e.type === "touchmove") {
    if (!e.touches || !e.touches[0]) return;

  const star = document.createElement("div");

/* ---------- 尺寸与点位 ---------- */
function getSize(){ return { w: document.documentElement.clientWidth || window.innerWidth, h: document.documentElement.clientHeight || window.innerHeight }; }

function getHeartPoints(num){
  const { w, h } = getSize(); const points = []; const ww = 110, wh = 60;
  const maxScaleW = Math.max(40, (w - ww) / 2); const maxScaleH = Math.max(40, (h - wh) / 2.125);
  const scale = Math.min(Math.min(w, h) * 0.38, maxScaleW, maxScaleH);
  const cx = w / 2, cy = h / 2 + 30;
  for (let i = 0; i < num; i++){
    const t = (i / num) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    points.push({ left: Math.max(0, Math.min(w - ww, cx + (x * scale) / 16 - ww / 2)), top: Math.max(0, Math.min(h - wh, cy + (y * scale) / 16 - wh / 2)) });
  }
  return points;
}
function getRandomPoints(num) {
  const { w, h } = getSize(); const points = []; const ww = 110, wh = 60;
  for (let i = 0; i < num; i++) { points.push({ left: Math.random() * Math.max(0, w - ww), top: Math.random() * Math.max(0, h - wh) }); }
  return points;
}
function createHeartPopups(points){
  const boxes = [];

  });

}
function createFullPopups(points){

}

/* ---------- 统一清场逻辑 ---------- */

/* ---------- 阶段0：爱心动画 ---------- */
function startAnimation(){
  const rid = runId; showSkipBtn();
  const heartPoints = getHeartPoints(texts.length);
  const heartBoxes = createHeartPopups(heartPoints);
  const popInterval = 90;
  heartBoxes.forEach((box, idx) => {
    later(() => { if (rid !== runId) return; box.classList.add("show"); }, idx * popInterval);
  });
  const finishTime = (heartBoxes.length - 1) * popInterval;
  later(() => {
    if (rid !== runId) return;
    later(() => {
      if (rid !== runId) return;
      heartBoxes.forEach(b => b.classList.add("hide"));
      later(() => {
        if (rid !== runId) return;
        heartBoxes.forEach(b => b.remove());
        startFullScreen();
      }, 400);
    }, 1000);
  }, finishTime);
}

/* ---------- 阶段0.5：满屏弹窗 + 停留2.4s + 缓慢淡出 ---------- */
function startFullScreen(){
  const rid = runId;
  document.querySelectorAll(".win.full-item").forEach(el => el.remove());
  fullBoxesGlobal = [];

  const total = 131; const interval = 4000 / total;
  const randomPoints = getRandomPoints(total);
  fullBoxesGlobal = createFullPopups(randomPoints);
  
  // 1. 弹幕乱序出现
  fullBoxesGlobal.forEach((box, idx) => {
    later(() => { if (rid !== runId) return; box.classList.add("show"); }, idx * interval);
  });
  
  const allFullEnd = (total - 1) * interval;
  
  later(() => {
    if (rid !== runId) return;
    
    // 2. 弹幕铺满后，停留 2.4 秒
    later(() => {
      if (rid !== runId) return;
      
      // 3. 背景弹幕开始缓慢淡出消失
      fullBoxesGlobal.forEach(b => {
        b.classList.add("zoom-out");

      grandModal.classList.add("show");

      // 5. 等 1.6 秒后，清理掉背景弹幕的DOM
      later(() => {
        if (rid !== runId) return;
        fullBoxesGlobal.forEach(b => b.remove());
        fullBoxesGlobal = [];
      }, 1600); 

    }, 2400); // 👈 改成了 2400 毫秒 (2.4秒)
  }, allFullEnd);
}

  const currentQ = CONFIG.quizData[currentQuizIndex];

  currentQ.options.forEach(opt => {

/* ---------- 打字机 ---------- */
let typeTimer = null;
let isTyping = false;
function typeWriter(text){
  clearTimeout(typeTimer); isTyping = true;
  const chars = Array.from(text);
  let i = 0;
  typeContent.innerHTML = `<span class="cursor"></span>`; letterGlass.scrollTop = 0;
  function type() {
    if (i < chars.length) {
      typeContent.innerHTML = chars.slice(0, i + 1).join("") + `<span class="cursor"></span>`;
      letterGlass.scrollTop = letterGlass.scrollHeight; i++;
      typeTimer = setTimeout(type, CONFIG.typeSpeed);
    } else { finishTyping(); }
  }
  type();
}
function finishTyping() {
  clearTimeout(typeTimer); isTyping = false;
  typeContent.textContent = CONFIG.letter; letterGlass.scrollTop = letterGlass.scrollHeight;
  loadFullBtnWrap.style.display = "none"; letterFooter.classList.add("show");
}

/* ---------- 各种点击事件 ---------- */
loadFullBtn.onclick = (e) => { e.stopPropagation(); if (isTyping) finishTyping(); };

surpriseBtn.onclick = (e) => { 
  e.stopPropagation(); 
  letterBoxWrap.classList.remove("showLetter"); 
  later(() => { 
    emotionSlider.value = 0;
    emotionFeedback.classList.remove("show");
    emotionBox.classList.remove("pulse");
    
    confirmEmotionBtn.style.display = "block";
    claimSurpriseBtn.style.display = "none";
    
    emotionPanel.classList.add("show"); 
  }, 600); 
};

backToLetterBtn.onclick = (e) => {
  e.stopPropagation();
  resetStage();
  letterBoxWrap.classList.add("showLetter");
  if (typeContent.textContent !== CONFIG.letter) {
    finishTyping();
  }
};

stampBtn.onclick = (e) => { e.stopPropagation(); stampBtn.classList.add("hide"); stampMark.classList.add("show"); };

function createRandomButton(text){
  document.querySelectorAll(".random-float-btn").forEach(el => el.remove());
  const btnEl = document.createElement("button"); btnEl.className = "random-float-btn"; btnEl.innerText = text; document.body.appendChild(btnEl);
  const { w, h } = getSize(); const bw = btnEl.offsetWidth || 130; const bh = btnEl.offsetHeight || 44;
  const marginX = Math.min(160, w * 0.15); const marginY = Math.min(120, h * 0.15);
  const safeW = Math.max(w - marginX * 2 - bw, 0); const safeH = Math.max(h - marginY * 2 - bh, 0);
  let left, top; const side = Math.floor(Math.random() * 4);
  if (side === 0){ left = marginX + Math.random() * safeW; top = marginY; } 
  else if (side === 1){ left = marginX + Math.random() * safeW; top = h - marginY - bh; } 
  else if (side === 2){ left = marginX; top = marginY + Math.random() * safeH; } 
  else { left = w - marginX - bw; top = marginY + Math.random() * safeH; }
  btnEl.style.left = Math.max(0, left) + "px"; btnEl.style.top = Math.max(0, top) + "px";
  return btnEl;
}

btnNo.onclick = () => {
  btnNo.classList.add("hideBtn");
  const btn1 = createRandomButton("求求了选右边吧");
  btn1.onclick = () => {
    if (!btn1.isConnected) return;
    btn1.remove(); const btn2 = createRandomButton("真不想看嘛🥺");
    btn2.onclick = () => {
      if (!btn2.isConnected) return;
      btn2.remove(); confirmModal.classList.remove("appear");
      fullBoxesGlobal.forEach(b => { b.style.transition = "opacity 1.2s ease"; b.style.opacity = "0"; });
      later(() => { 
        fullBoxesGlobal.forEach(b => b.remove()); 
        fullBoxesGlobal = []; 
        forceModal.classList.add("show"); 
      }, 1200);
    };
  };
};

btnYes.onclick = () => showEnvelope();
forceOkBtn.onclick = () => showEnvelope();

/* ==================== 全局跳过按钮逻辑 ==================== */
skipBtn.onclick = () => {
  runId++;
  clearPending();
  clearTimeout(typeTimer);
  isTyping = false;

  resetStage();
  document.querySelectorAll('.overlay-panel').forEach(el => el.classList.remove('show'));
  letterBoxWrap.classList.remove("showLetter");

  skipModal.classList.add("show");
};

document.querySelectorAll('.skip-menu-btn').forEach(btnEl => {
  btnEl.addEventListener('click', () => jumpTo(btnEl.dataset.jump));
});

function jumpTo(step) {
  clearPending();
  clearTimeout(typeTimer);
  isTyping = false;
  skipModal.classList.remove("show");
  if (step === 'emotion') {
    emotionSlider.value = 0;
    emotionFeedback.classList.remove("show");
    emotionBox.classList.remove("pulse");
    confirmEmotionBtn.style.display = "block";
    claimSurpriseBtn.style.display = "none";
    emotionPanel.classList.add("show");
    showSkipBtn();
  } else if (step === 'quiz') {
    currentQuizIndex = 0;
    quizPanel.classList.add("show");
    renderQuiz();
    showSkipBtn();
  } else if (step === 'envelope') {
    showEnvelope();
    hideSkipBtn();
  }
}

letterBoxWrap.addEventListener("click", (e) => {
  if (e.target.closest("#replayBtn") || e.target.closest("#surpriseBtn") || e.target.closest("#loadFullBtn")) return;
  if (isTyping) finishTyping();
});

replayBtn.onclick = (e) => {
  e.stopPropagation(); 
  runId++;
  clearPending();
  clearTimeout(typeTimer);
  resetStage();
  letterBoxWrap.classList.remove("showLetter"); letterFooter.classList.remove("show");
  loadFullBtnWrap.style.display = "block";
  typeContent.innerHTML = "";
  isTyping = false; hideSkipBtn();
  stampBtn.classList.remove("hide"); stampMark.classList.remove("show");
  
  currentQuizIndex = 0; 
  emotionSlider.value = 0;
  emotionFeedback.classList.remove("show");
  emotionBox.classList.remove("pulse");
  confirmEmotionBtn.style.display = "block";
  claimSurpriseBtn.style.display = "none";
  
  const rid = runId;
  later(() => {
    if (rid !== runId) return;
    startAnimation();
  }, 1100);
};

let hintTimer = null;
function showHint(msg){
  inputHint.textContent = msg; inputHint.classList.add("show"); inputHint.classList.add("shake");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { input.classList.remove("shake"); inputHint.classList.remove("show"); }, 2200);
}

btn.onclick = () => {
  if (panel.classList.contains("hide")) return;  
  const value = input.value.trim();
  if (value === CONFIG.loverName){
    inputHint.classList.remove("show"); panel.classList.add("hide");
    const rid = runId;
    later(() => {
      if (rid !== runId) return;
      runId++; startAnimation();
    }, 850);
  } else {
    showHint("名字不对哦，再试一次~");
  }
};

input.onkeydown = (e) => { if (e.key === "Enter") btn.click(); };
input.oninput = () => { if (inputHint.classList.contains("show")){ inputHint.classList.remove("show"); input.classList.remove("shake"); } };
</script>
</body>
</html>
