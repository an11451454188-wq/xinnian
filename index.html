<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>新年快乐</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
body{
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, #ffd1dc 0%, transparent 26%),
    radial-gradient(circle at 80% 10%, #ffb6d9 0%, transparent 28%),
    radial-gradient(circle at 50% 80%, #ff9ec7 0%, transparent 32%),
    linear-gradient(135deg, #ffe4f1 0%, #ffc2df 45%, #ffa5d2 100%);
}
#heartsBg{
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-heart{
  position: absolute;
  bottom: -40px;
  color: #ff6fa2;
  opacity: 0.35;
  animation: floatUp linear infinite;
  user-select: none;
}
@keyframes floatUp{
  0%{ transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
  10%{ opacity: 0.4; }
  90%{ opacity: 0.35; }
  100%{ transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
}
#inputPanel{
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 20px;
  transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
}
#inputPanel.hide{
  transform: translateY(120vh);
  opacity: 0;
  pointer-events: none;
}
.title1-wrap{
  background: rgba(255, 255, 255, 0.18);
  padding: 14px 36px;
  border-radius: 24px;
  box-shadow:
    0 8px 32px rgba(255, 105, 180, 0.35),
    inset 0 0 20px rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid rgba(255, 255, 255, 0.35);
  margin-bottom: 16px;
}
.title1{
  font-size: clamp(22px, 6vw, 28px);
  color: #c41e5c;
  letter-spacing: 6px;
  font-weight: 700;
  text-shadow:
    0 0 8px rgba(255,255,255,0.9),
    0 0 18px rgba(255, 116, 168, 0.8);
}
.title2{
  font-size: clamp(18px, 5vw, 22px);
  color: #c2185b;
  margin-bottom: 12px;
  letter-spacing: 2px;
  font-weight: 500;
}
.title3{
  font-size: clamp(15px, 4.2vw, 18px);
  color: #b04070;
  margin-bottom: 36px;
  letter-spacing: 1px;
  font-weight: 400;
  text-align: center;
}
#nameInput{
  width: min(280px, 80vw);
  height: 46px;
  border-radius: 24px;
  border: 2px solid #ff9ec7;
  outline: none;
  padding: 0 20px;
  font-size: 16px;
  font-weight: 400;
  background: #fff8fc;
  color: #773355;
  box-shadow: 0 0 14px #ff9ec788;
  transition: border-color 0.3s, box-shadow 0.3s;
}
#nameInput.shake{
  border-color: #ff4d8d;
  animation: shake 0.4s;
}
@keyframes shake{
  0%, 100%{ transform: translateX(0); }
  20%{ transform: translateX(-8px); }
  40%{ transform: translateX(8px); }
  60%{ transform: translateX(-6px); }
  80%{ transform: translateX(6px); }
}
#inputHint{
  margin-top: 12px;
  font-size: 14px;
  color: #c2185b;
  min-height: 20px;
  opacity: 0;
  transition: opacity 0.3s;
}
#inputHint.show{ opacity: 1; }
#confirmBtn{
  margin-top: 20px;
  width: 140px;
  height: 44px;
  border-radius: 22px;
  border: none;
  font-size: 17px;
  font-weight: 500;
  background: linear-gradient(135deg, #ff75a8, #ff4d8d);
  color: #fff;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 8px 20px #ff4d8d66;
}
#confirmBtn:active{ transform: scale(0.95); }

/* 爱心阶段弹窗：尺寸缩小，不再那么笨重 */
.win.heart-item{
  position: absolute;
  width: 110px;   
  height: 60px;   
  border-radius: 10px;
  box-shadow: 0 0 14px #ffffffaa;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px;
  font-size: 11px; 
  font-weight: 400;
  color: #444444;
  opacity: 0;
  transform: translateY(120vh) scale(0.5);
  transition: opacity 0.55s ease, transform 0.55s ease;
  line-height: 1.35;
  z-index: 5;
  pointer-events: none;
}
.win.heart-item.show{ opacity: 1; transform: translateY(0) scale(1); }
.win.heart-item.hide{ opacity: 0; transform: scale(0.6); }

/* 满屏弹窗：恢复原来的大小 110x60，字号 11px */
.win.full-item{
  position: absolute;
  width: 110px;
  height: 60px;
  border-radius: 10px;
  box-shadow: 0 0 14px #ffffffaa;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px;
  font-size: 11px;
  font-weight: 400;
  color: #444444;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.4s ease, transform 0.4s ease;
  line-height: 1.35;
  z-index: 5;
  pointer-events: none;
}
.win.full-item.show{ opacity: 1; transform: scale(1); }

/* 跳过按钮 */
#skipBtn{
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 50;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #a42c5e;
  font-size: 13px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#skipBtn.show{ opacity: 1; pointer-events: auto; }

/* 确认弹窗 */
#confirmModal{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
  padding: 20px;
}
#confirmModal.appear{ opacity: 1; pointer-events: auto; }
.modal-box{
  width: min(340px, 90vw);
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.35);
  padding: 28px 24px;
  box-shadow: 0 8px 30px rgba(255,80,140,0.25);
}
.modal-text{
  text-align: center;
  font-size: 17px;
  color: #882b55;
  margin-bottom: 26px;
  line-height: 1.6;
}
.btn-row{ display: flex; gap: 16px; justify-content: center; }
.modal-btn{
  padding: 10px 26px;
  border-radius: 22px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.4s ease;
}
#btnNo{ background: #e8e8e8; color: #555; }
#btnNo.hideBtn{
  opacity: 0;
  pointer-events: none;
  transform: scale(0.7);
}
#btnYes{
  background: linear-gradient(135deg,#ff75a8,#ff4d8d);
  color: #fff;
  box-shadow: 0 4px 14px #ff4d8d44;
}

/* 乱跑按钮 */
.random-float-btn{
  position: fixed;
  z-index: 35;
  border: none;
  border-radius: 24px;
  padding: 8px 20px;
  font-size: 15px;
  cursor: pointer;
  background: #eeeeee;
  color: #444;
  box-shadow: 0 4px 12px #00000022;
  transition: transform 0.3s ease;
}
.random-float-btn:active{ transform: scale(0.92); }

/* 霸道强制弹窗 */
#forceModal{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 45;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  padding: 20px;
}
#forceModal.show{ opacity: 1; pointer-events: auto; }
.force-box{
  width: min(320px, 90vw);
  background: rgba(255,255,255,0.24);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 30px 24px;
  text-align: center;
}
.force-text{
  font-size: 18px;
  color: #902b55;
  margin-bottom: 24px;
  line-height: 1.7;
}
#forceOkBtn{
  border: none;
  border-radius: 24px;
  padding: 10px 30px;
  font-size: 16px;
  color: white;
  background: linear-gradient(135deg,#ff75a8,#ff4d8d);
  box-shadow: 0 4px 14px #ff4d8d44;
  cursor: pointer;
}

  position: fixed;
  inset: 0;

  padding: 20px;

.cursor{

<body>
<div id="heartsBg"></div>

<button id="skipBtn">跳过 ≫</button>

<div id="inputPanel">
  <div class="title1-wrap">
    <div class="title1" id="pageTitle">祝袁语汐新年快乐</div>
  </div>
  <div class="title2">这是专属于你的网站</div>
  <div class="title3">输入你的名字 查收我对你的心意</div>
  <input id="nameInput" placeholder="只有输入你的名字可以呦" autocomplete="off" />
  <div id="inputHint"></div>
  <button id="confirmBtn">确认</button>
</div>

<div id="confirmModal">
  <div class="modal-box">
    <div class="modal-text">潘城给你写了封信<br>要打开来看看吗</div>
    <div class="btn-row">
      <button class="modal-btn" id="btnNo">选右边的</button>
      <button class="modal-btn" id="btnYes">好呀</button>
    </div>
  </div>
</div>

<div id="forceModal">
  <div class="force-box">
    <div class="force-text">嘻嘻 我要强制爱<br>你必须读哦</div>
    <button id="forceOkBtn">知道啦</button>
  </div>
</div>

<div id="letterBoxWrap">
  <div class="letter-glass">
    <div class="type-area" id="typeContent"></div>
    <div id="letterFooter">
      <button id="replayBtn">再看一遍</button>
    </div>
  </div>
</div>

<script>
/* ==================== 可配置区 ==================== */
const CONFIG = {
  loverName: "袁语汐",            
  pageTitle: "祝袁语汐新年快乐",  
  typeSpeed: 75,                
  letter: `亲爱的：
新年快乐。
这是我第一次用这种方式给你写信，可能看起来有点笨拙，但每一句都是真心话。
谢谢你出现在我的生活里，谢谢你包容我的小脾气，谢谢你的每一次耐心和温柔。
新的一年，希望我们依然一起看日出日落，一起吃很多顿饭，一起去很多没去过的地方。
愿你岁岁平安，万事胜意。
愿我们能一直这样，平平淡淡地走下去。
                   爱你的，潘城`,
  greetings: [
    "愿你岁岁平安✨","万事皆能如愿🎆","日子温柔闪光💖","前路万事可期🌟",
    "平安喜乐常伴🎇","烦恼统统远离🍀","年年胜意欢愉💫","提笔合笔如愿📖",
    "三餐四季温暖🌷","美好不期而遇🧧","奔赴心中热爱🌠","永远闪闪发光🥰",
    "眼里盛满星光🌞","脚下皆是坦途🛤️","所得皆是欢喜🍃","一路繁花相伴🌸",
    "心有繁花盛放🌿","平安无疾如常🕊️","岁月毫无蹉跎🎐","朝朝暮暮幸福💌",
    "慢慢慢慢发光✨","所愿皆能成真🚩","岁岁常得欢愉🎊","长安宁多喜乐🪐",
    "生活明朗可爱☁️","快乐时刻满格🥳","心之所向皆往🌌","良辰万事可期🎁",
    "自在无忧从容🎋","星光奔赴于你🌙","一路向阳温暖☀️","岁岁惦念如初💞",
    "且喜且乐长久🍵","山海皆可奔赴⛰️","人间日子滚烫🔥","被温柔包围着💖",
    "好运接踵而来🍂","浪漫永不落幕🌷","欢喜藏于日常🎀","前路清风相伴🍃",
    "所想皆有回响🔔","岁岁与美好相逢🌙","温柔常驻心底💓","好运一路同行🛤️",
    "保持满心欢喜🥰","万事顺意无忧🎆","邂逅所有美好✨","岁岁共享浪漫💌",
    "日子满是甜意🍬","奔赴属于光亮🌟","爱意岁岁绵长💞","潘城爱袁语汐❤️"
  ],
  colors: ["#ffe6ef","#e6f7ff","#fff7d9","#e9ffe9","#f3e8ff","#ffeede"]
};
/* ================================================== */

const texts = CONFIG.greetings;
const colorList = CONFIG.colors;

/* ---------- 背景小爱心 ---------- */
const heartsBg = document.getElementById("heartsBg");
(function createBgHearts(){
  for (let i = 0; i < 60; i++){
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.textContent = "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 18 + 14) + "px";
    heart.style.animationDuration = (Math.random() * 8 + 8) + "s";
    heart.style.animationDelay = Math.random() * 10 + "s";
    heartsBg.appendChild(heart);
  }
})();

/* ---------- 尺寸工具 ---------- */
function getSize(){
  return {
    w: document.documentElement.clientWidth || window.innerWidth,
    h: document.documentElement.clientHeight || window.innerHeight
  };
}

/* ---------- 爱心点位（尺寸已匹配新的 110x60 弹窗） ---------- */
function getHeartPoints(num){
  const { w, h } = getSize();
  const points = [];
  const ww = 110; // 与 CSS 宽度一致
  const wh = 60;  // 与 CSS 高度一致
  const maxScaleW = Math.max(40, (w - ww) / 2);
  const maxScaleH = Math.max(40, (h - wh) / 2.125);
  const scale = Math.min(Math.min(w, h) * 0.38, maxScaleW, maxScaleH);
  const cx = w / 2;
  const cy = h / 2 + 30;
  
  for (let i = 0; i < num; i++){
    const t = (i / num) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    points.push({
      left: Math.max(0, Math.min(w - ww, cx + (x * scale) / 16 - ww / 2)),
      top:  Math.max(0, Math.min(h - wh, cy + (y * scale) / 16 - wh / 2))
    });
  }
  return points;
}

/* ---------- 满屏点位（原版 110x60 尺寸的完全随机） ---------- */
function getRandomPoints(num) {
  const { w, h } = getSize();
  const points = [];
  const ww = 110;
  const wh = 60;
  for (let i = 0; i < num; i++) {
    points.push({
      left: Math.random() * Math.max(0, w - ww),
      top: Math.random() * Math.max(0, h - wh)
    });
  }
  return points;
}

/* ---------- 创建弹窗 ---------- */
function createHeartPopups(points){
  const boxes = [];
  points.forEach((pos, idx) => {
    const div = document.createElement("div");
    div.className = "win heart-item";
    div.innerText = texts[idx % texts.length];
    div.style.left = pos.left + "px";
    div.style.top = pos.top + "px";
    div.style.background = colorList[idx % colorList.length];
    document.body.appendChild(div);
    boxes.push(div);
  });
  return boxes;
}
function createFullPopups(points){
  const boxes = [];
  points.forEach((pos, idx) => {
    const div = document.createElement("div");
    div.className = "win full-item";
    div.innerText = texts[idx % texts.length];
    div.style.left = pos.left + "px";
    div.style.top = pos.top + "px";
    div.style.background = colorList[idx % colorList.length];
    document.body.appendChild(div);
    boxes.push(div);
  });
  return boxes;
}

/* ---------- DOM 引用 ---------- */
const panel       = document.getElementById("inputPanel");
const input       = document.getElementById("nameInput");
const btn         = document.getElementById("confirmBtn");
const inputHint   = document.getElementById("inputHint");
const pageTitle   = document.getElementById("pageTitle");

const confirmModal = document.getElementById("confirmModal");
const btnNo        = document.getElementById("btnNo");
const btnYes       = document.getElementById("btnYes");

const letterBoxWrap = document.getElementById("letterBoxWrap");
const letterGlass   = document.querySelector(".letter-glass");
const typeContent   = document.getElementById("typeContent");
const letterFooter  = document.getElementById("letterFooter");
const replayBtn     = document.getElementById("replayBtn");

const forceModal   = document.getElementById("forceModal");
const forceOkBtn   = document.getElementById("forceOkBtn");
const skipBtn      = document.getElementById("skipBtn");

/* 初始化文本 */
pageTitle.textContent = CONFIG.pageTitle;

/* ---------- 动画控制 ---------- */
let runId = 0;          
let typingToken = 0;
let typingSkip = false;
let typingActive = false;
let fullBoxesGlobal = [];

function showSkipBtn(){ skipBtn.classList.add("show"); }
function hideSkipBtn(){ skipBtn.classList.remove("show"); }

/* ---------- 爱心阶段 ---------- */
function startAnimation(){
  const rid = runId;
  showSkipBtn();

  const heartPoints = getHeartPoints(texts.length);
  const heartBoxes = createHeartPopups(heartPoints);
  const popInterval = 90;

  heartBoxes.forEach((box, idx) => {
    setTimeout(() => {
      if (rid !== runId) return;
      box.classList.add("show");
    }, idx * popInterval);
  });

  const finishTime = (heartBoxes.length - 1) * popInterval;
  setTimeout(() => {
    if (rid !== runId) return;
    setTimeout(() => {
      if (rid !== runId) return;
      heartBoxes.forEach(b => b.classList.add("hide"));
      setTimeout(() => {
        if (rid !== runId) return;
        heartBoxes.forEach(b => b.remove());
        startFullScreen();
      }, 400);
    }, 1000);
  }, finishTime);
}

/* ---------- 满屏阶段 ---------- */
function startFullScreen(){
  const rid = runId;
  const total = 131;
  const interval = 4000 / total;
  
  const randomPoints = getRandomPoints(total);
  fullBoxesGlobal = createFullPopups(randomPoints);

  fullBoxesGlobal.forEach((box, idx) => {
    setTimeout(() => {
      if (rid !== runId) return;
      box.classList.add("show");
    }, idx * interval);
  });

  const allFullEnd = (total - 1) * interval;
  setTimeout(() => {
    if (rid !== runId) return;
    setTimeout(() => {
      if (rid !== runId) return;
      fullBoxesGlobal.forEach(b => {
        b.style.transition = "opacity 1.2s ease";
        b.style.opacity = "0";
      });
      setTimeout(() => {
        if (rid !== runId) return;
        fullBoxesGlobal.forEach(b => b.remove());
        fullBoxesGlobal = [];
        confirmModal.classList.add("appear");
      }, 1200);
    }, 2000);
  }, allFullEnd);
}

/* ---------- 打开信件 ---------- */
function openLetter(){
  runId++;                 
  document.querySelectorAll(".win").forEach(el => el.remove());
  document.querySelectorAll(".random-float-btn").forEach(el => el.remove());
  confirmModal.classList.remove("appear");
  forceModal.classList.remove("show");
  hideSkipBtn();
  letterFooter.classList.remove("show");

  letterBoxWrap.classList.add("showLetter");
  setTimeout(() => typeWriter(CONFIG.letter), 100);
}

/* ---------- 打字机 ---------- */
async function typeWriter(text){
  const myToken = ++typingToken;
  typingSkip = false;
  typingActive = true;
  typeContent.innerHTML = `<span class="cursor"></span>`;
  letterGlass.scrollTop = 0;

  for (let i = 0; i < text.length; i++){
    if (myToken !== typingToken) return;
    if (typingSkip){
      typeContent.textContent = text;
      letterGlass.scrollTop = letterGlass.scrollHeight;
      typingActive = false;
      letterFooter.classList.add("show");
      return;
    }
    typeContent.innerHTML = text.substring(0, i + 1) + `<span class="cursor"></span>`;
    letterGlass.scrollTop = letterGlass.scrollHeight;
    await new Promise(r => setTimeout(r, CONFIG.typeSpeed));
  }

  if (myToken !== typingToken) return;
  typeContent.textContent = text;   
  letterGlass.scrollTop = letterGlass.scrollHeight;
  typingActive = false;
  letterFooter.classList.add("show");
}
function finishTyping(){
  if (typingActive) typingSkip = true;
}

/* ---------- 乱跑按钮（窄屏安全版） ---------- */
function createRandomButton(text){
  document.querySelectorAll(".random-float-btn").forEach(el => el.remove());

  const btnEl = document.createElement("button");
  btnEl.className = "random-float-btn";
  btnEl.innerText = text;
  document.body.appendChild(btnEl);

  const { w, h } = getSize();
  const bw = btnEl.offsetWidth  || 130;
  const bh = btnEl.offsetHeight || 44;
  const marginX = Math.min(160, w * 0.15);
  const marginY = Math.min(120, h * 0.15);
  const safeW = Math.max(w - marginX * 2 - bw, 0);
  const safeH = Math.max(h - marginY * 2 - bh, 0);

  let left, top;
  const side = Math.floor(Math.random() * 4);
  if (side === 0){
    left = marginX + Math.random() * safeW;
    top  = marginY;
  } else if (side === 1){
    left = marginX + Math.random() * safeW;
    top  = h - marginY - bh;
  } else if (side === 2){
    left = marginX;
    top  = marginY + Math.random() * safeH;
  } else {
    left = w - marginX - bw;
    top  = marginY + Math.random() * safeH;
  }
  btnEl.style.left = Math.max(0, left) + "px";
  btnEl.style.top  = Math.max(0, top)  + "px";
  return btnEl;
}

/* ---------- 「选右边的」分支 ---------- */
btnNo.onclick = () => {
  btnNo.classList.add("hideBtn");
  const btn1 = createRandomButton("选右边的吧");
  btn1.onclick = () => {
    btn1.remove();
    const btn2 = createRandomButton("真不想看嘛🥺");
    btn2.onclick = () => {
      btn2.remove();
      confirmModal.classList.remove("appear");
      fullBoxesGlobal.forEach(b => {
        b.style.transition = "opacity 1.2s ease";
        b.style.opacity = "0";
      });
      setTimeout(() => {
        fullBoxesGlobal.forEach(b => b.remove());
        fullBoxesGlobal = [];
        forceModal.classList.add("show");
      }, 1200);
    };
  };
};

btnYes.onclick = () => openLetter();
forceOkBtn.onclick = () => openLetter();

/* ---------- 跳过按钮 ---------- */
skipBtn.onclick = () => {
  runId++; 
  document.querySelectorAll(".win").forEach(el => el.remove());
  document.querySelectorAll(".random-float-btn").forEach(el => el.remove());
  hideSkipBtn();
  confirmModal.classList.add("appear");
};

/* ---------- 点击信件区域 → 跳过打字 ---------- */
letterBoxWrap.addEventListener("click", (e) => {
  if (e.target.closest("#replayBtn")) return;
  finishTyping();
});

/* ---------- 再看一遍 ---------- */
replayBtn.onclick = (e) => {
  e.stopPropagation();
  runId++;
  document.querySelectorAll(".win").forEach(el => el.remove());
  document.querySelectorAll(".random-float-btn").forEach(el => el.remove());
  confirmModal.classList.remove("appear");
  forceModal.classList.remove("show");
  letterBoxWrap.classList.remove("showLetter");
  letterFooter.classList.remove("show");
  btnNo.classList.remove("hideBtn");
  typeContent.innerHTML = "";
  typingToken++;
  hideSkipBtn();
  setTimeout(() => startAnimation(), 1100);
};

/* ---------- 输入校验 ---------- */
let hintTimer = null;
function showHint(msg){
  inputHint.textContent = msg;
  inputHint.classList.add("show");
  input.classList.add("shake");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    input.classList.remove("shake");
    inputHint.classList.remove("show");
  }, 2200);
}

btn.onclick = () => {
  const value = input.value.trim();
  if (value === CONFIG.loverName){
    inputHint.classList.remove("show");
    panel.classList.add("hide");
    setTimeout(() => {
      runId++;
      startAnimation();
    }, 850);
  } else {
    showHint("名字不对哦，再试一次~");
  }
};

input.onkeydown = (e) => {
  if (e.key === "Enter") btn.click();
};
input.oninput = () => {
  if (inputHint.classList.contains("show")){
    inputHint.classList.remove("show");
    input.classList.remove("shake");
  }
};
</script>
</body>
